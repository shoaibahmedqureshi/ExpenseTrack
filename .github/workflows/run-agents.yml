name: Run AI Agents Daily

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC - SEO Agent
    - cron: '0 8 * * *'  # 8 AM UTC - Influencer Agent

jobs:
  seo-agent:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 6 * * *'
    steps:
      - name: Run SEO Agent
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 -X POST https://xgavxbuezmivnseyhkye.supabase.co/functions/v1/seo_aso_agent \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE" \
            -d '{}'

  influencer-agent:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 8 * * *'
    steps:
      - name: Run Influencer Agent
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 -X POST https://xgavxbuezmivnseyhkye.supabase.co/functions/v1/influencer_agent \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE" \
            -d '{}'
