name: Run Profile Automation Agent

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'agents/profile-automation/package-lock.json'

      - name: Install dependencies
        run: |
          cd agents/profile-automation
          npm install --production

      - name: Run Profile Agent
        run: |
          cd agents/profile-automation
          npm start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}

      - name: Log completion
        if: success()
        run: echo "✅ Profile agent completed successfully"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Profile agent failed - check logs"
