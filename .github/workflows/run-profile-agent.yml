name: Run Profile Automation Agent

# Scheduling is switched off: 6 of 10 runs failed with no error text, and it needs the Gmail
# credential that is being replaced. Run by hand once that is sorted.
on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'agents/profile-automation/package-lock.json'

      - name: Install dependencies
        run: |
          cd agents/profile-automation
          npm install --production

      - name: Run Profile Agent
        run: |
          cd agents/profile-automation
          npm start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}

      - name: Log completion
        if: success()
        run: echo "✅ Profile agent completed successfully"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Profile agent failed - check logs"
