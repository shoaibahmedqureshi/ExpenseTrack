<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outlay Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #2D6A4F; margin-bottom: 30px; }

    .settings-box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; color: #333; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em; }
    button { padding: 10px 20px; background: #2D6A4F; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; margin-right: 10px; }
    button:hover { opacity: 0.9; }

    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .metric-card { background: white; padding: 20px; border-radius: 8px; border-left: 4px solid #2D6A4F; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .metric-value { font-size: 2.5em; font-weight: 700; color: #2D6A4F; margin: 10px 0; }
    .metric-label { font-size: 0.9em; color: #666; text-transform: uppercase; }

    .status { padding: 10px; margin: 10px 0; border-radius: 4px; font-weight: 600; }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.loading { background: #d1ecf1; color: #0c5460; }

    table { width: 100%; background: white; border-collapse: collapse; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-top: 20px; }
    th { background: #f5f5f5; padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #ddd; }
    td { padding: 12px; border-bottom: 1px solid #eee; }
    tr:hover { background: #fafafa; }
    a { color: #2D6A4F; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <h1>🤖 Outlay Agent Dashboard</h1>

  <div class="settings-box">
    <h2>⚙️ Configuration</h2>
    <div class="form-group">
      <label>Supabase URL:</label>
      <input type="text" id="url" placeholder="https://xxxxx.supabase.co">
    </div>
    <div class="form-group">
      <label>Publishable Key:</label>
      <input type="password" id="key" placeholder="sb_...">
    </div>
    <button onclick="saveAndLoad()">Save & Load Data</button>
    <button onclick="toggleKey()">Show Key</button>
    <button onclick="clearSettings()">Clear All</button>
    <div id="status"></div>
  </div>

  <div class="metrics" id="metrics"></div>

  <h2>Activity Logs</h2>
  <table id="logs-table">
    <thead>
      <tr>
        <th>Agent Type</th>
        <th>Action</th>
        <th>Status</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="logs-body">
      <tr><td colspan="4" style="text-align: center; color: #999;">Load data to see logs</td></tr>
    </tbody>
  </table>

  <h2 style="margin-top: 30px;">Profiles Created</h2>
  <table id="profiles-table">
    <thead>
      <tr>
        <th>Platform</th>
        <th>URL</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="profiles-body">
      <tr><td colspan="3" style="text-align: center; color: #999;">Load data to see profiles</td></tr>
    </tbody>
  </table>

  <h2 style="margin-top: 30px;">Email Drafts</h2>
  <table id="drafts-table">
    <thead>
      <tr>
        <th>Recipient</th>
        <th>Status</th>
        <th>Fit Score</th>
        <th>Platform</th>
      </tr>
    </thead>
    <tbody id="drafts-body">
      <tr><td colspan="4" style="text-align: center; color: #999;">Load data to see drafts</td></tr>
    </tbody>
  </table>
</div>

<script>
function toggleKey() {
  const el = document.getElementById('key');
  el.type = el.type === 'password' ? 'text' : 'password';
}

function clearSettings() {
  try { localStorage.removeItem('dashboard-url'); } catch(e) {}
  try { localStorage.removeItem('dashboard-key'); } catch(e) {}
  document.getElementById('url').value = '';
  document.getElementById('key').value = '';
  document.getElementById('status').innerHTML = '<div class="status loading">Settings cleared</div>';
}

function status(msg, type = 'loading') {
  const el = document.getElementById('status');
  el.innerHTML = `<div class="status ${type}">${msg}</div>`;
  console.log(`[${type.toUpperCase()}] ${msg}`);
}

function saveAndLoad() {
  const url = document.getElementById('url').value.trim();
  const key = document.getElementById('key').value.trim();

  if (!url || !key) {
    status('❌ Please enter both URL and key', 'error');
    return;
  }

  try {
    localStorage.setItem('dashboard-url', url);
    localStorage.setItem('dashboard-key', key);
  } catch(e) {
    // localStorage not available, that's ok
  }

  status('📡 Loading data...', 'loading');
  loadData(url, key);
}

async function loadData(url, key) {
  try {
    console.log('Starting data load from:', url);

    // Fetch agent logs
    console.log('Fetching agent_logs...');
    const logsResp = await fetch(`${url}/rest/v1/agent_logs?select=*`, {
      headers: {
        'apikey': key,
        'Authorization': `Bearer ${key}`
      }
    });

    console.log('Logs response:', logsResp.status);
    if (!logsResp.ok) {
      const error = await logsResp.text();
      throw new Error(`Logs error ${logsResp.status}: ${error}`);
    }
    const logs = await logsResp.json();
    console.log('Loaded logs:', logs.length, 'records');

    // Fetch profiles
    console.log('Fetching profile_links...');
    const profilesResp = await fetch(`${url}/rest/v1/profile_links?select=*`, {
      headers: {
        'apikey': key,
        'Authorization': `Bearer ${key}`
      }
    });

    console.log('Profiles response:', profilesResp.status);
    if (!profilesResp.ok) {
      const error = await profilesResp.text();
      throw new Error(`Profiles error ${profilesResp.status}: ${error}`);
    }
    const profiles = await profilesResp.json();
    console.log('Loaded profiles:', profiles.length, 'records');

    // Fetch email drafts
    console.log('Fetching email_drafts...');
    const draftsResp = await fetch(`${url}/rest/v1/email_drafts?select=*`, {
      headers: {
        'apikey': key,
        'Authorization': `Bearer ${key}`
      }
    });

    console.log('Drafts response:', draftsResp.status);
    if (!draftsResp.ok) {
      const error = await draftsResp.text();
      throw new Error(`Drafts error ${draftsResp.status}: ${error}`);
    }
    const drafts = await draftsResp.json();
    console.log('Loaded drafts:', drafts.length, 'records');

    // Display everything
    displayMetrics(logs, profiles, drafts);
    displayLogs(logs);
    displayProfiles(profiles);
    displayDrafts(drafts);

    status(`✅ Loaded: ${logs.length} logs, ${profiles.length} profiles, ${drafts.length} drafts`, 'success');
  } catch (error) {
    console.error('Error during load:', error);
    status(`❌ Error: ${error.message}`, 'error');
  }
}

function displayMetrics(logs, profiles, drafts) {
  const approved = drafts.filter(d => d.status === 'approved').length;
  const pending = drafts.filter(d => d.status === 'pending_review').length;

  const html = `
    <div class="metric-card">
      <div class="metric-label">Agent Runs</div>
      <div class="metric-value">${logs.length}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Profiles Created</div>
      <div class="metric-value">${profiles.length}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Email Drafts</div>
      <div class="metric-value">${drafts.length}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Pending Review</div>
      <div class="metric-value">${pending}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Approved</div>
      <div class="metric-value">${approved}</div>
    </div>
  `;
  document.getElementById('metrics').innerHTML = html;
}

function displayLogs(logs) {
  if (logs.length === 0) {
    document.getElementById('logs-body').innerHTML = '<tr><td colspan="4" style="text-align: center; color: #999;">No logs yet</td></tr>';
    return;
  }

  const html = logs.slice(0, 20).map(log => `
    <tr>
      <td>${log.agent_type || 'unknown'}</td>
      <td>${log.action || 'unknown'}</td>
      <td><span style="background: ${log.status === 'success' ? '#d4edda' : log.status === 'error' ? '#f8d7da' : '#d1ecf1'}; padding: 4px 8px; border-radius: 3px; font-size: 0.85em;">${log.status || 'unknown'}</span></td>
      <td>${new Date(log.run_date).toLocaleString()}</td>
    </tr>
  `).join('');

  document.getElementById('logs-body').innerHTML = html;
}

function displayProfiles(profiles) {
  if (profiles.length === 0) {
    document.getElementById('profiles-body').innerHTML = '<tr><td colspan="3" style="text-align: center; color: #999;">No profiles yet</td></tr>';
    return;
  }

  // Filter: only show profiles with actual usernames/paths (not generic domain URLs)
  const actualProfiles = profiles.filter(p => {
    const url = p.platform_url || '';
    return url.includes('/') && url.split('/').length > 3; // e.g., https://dev.to/username
  });

  if (actualProfiles.length === 0) {
    document.getElementById('profiles-body').innerHTML = '<tr><td colspan="3" style="text-align: center; color: #999;">No created profiles yet</td></tr>';
    return;
  }

  const html = actualProfiles.map(p => `
    <tr>
      <td>${p.platform || 'unknown'}</td>
      <td><a href="${p.platform_url}" target="_blank" style="color: #2D6A4F; font-weight: 600;">${p.platform_url}</a></td>
      <td><span style="background: #d4edda; padding: 4px 8px; border-radius: 3px; font-size: 0.85em;;">created</span></td>
    </tr>
  `).join('');

  document.getElementById('profiles-body').innerHTML = html;
}

function displayDrafts(drafts) {
  if (drafts.length === 0) {
    document.getElementById('drafts-body').innerHTML = '<tr><td colspan="4" style="text-align: center; color: #999;">No drafts yet</td></tr>';
    return;
  }

  const html = drafts.slice(0, 20).map(d => `
    <tr>
      <td>${d.recipient_name || 'unknown'}</td>
      <td><span style="background: ${d.status === 'approved' ? '#d4edda' : d.status === 'pending_review' ? '#fff3cd' : '#d1ecf1'}; padding: 4px 8px; border-radius: 3px; font-size: 0.85em;">${d.status || 'unknown'}</span></td>
      <td>${d.metadata?.fit_score || 'N/A'}</td>
      <td>${d.recipient_platform || 'unknown'}</td>
    </tr>
  `).join('');

  document.getElementById('drafts-body').innerHTML = html;
}

// Load saved settings on page load
window.addEventListener('DOMContentLoaded', () => {
  console.log('Dashboard loaded');
  let savedUrl, savedKey;
  try {
    savedUrl = localStorage.getItem('dashboard-url');
    savedKey = localStorage.getItem('dashboard-key');
  } catch(e) {}

  if (savedUrl) {
    document.getElementById('url').value = savedUrl;
  }
  if (savedKey) {
    document.getElementById('key').value = savedKey;
  }

  if (savedUrl && savedKey) {
    status('Auto-loading saved settings...', 'loading');
    setTimeout(() => loadData(savedUrl, savedKey), 500);
  }
});
</script>

</body>
</html>
